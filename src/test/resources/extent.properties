extent.reporter.spark.start=true
extent.reporter.spark.out=target/ExtentReports/ExtentReport.html

#extent.reporter.spark.config=src/test/resources/spark-config.xml

# Screenshot settings for Extent Reports
extent.reporter.spark.vieworder=1
extent.report.statusfilterorder=1,2,3,4,5

# Enable screenshot embedding in Extent Report
screenshot.dir=target/screenshots
screenshot.rel.path=../screenshots/

# Attach screenshots to report
extent.reporter.spark.embed=true
extent.reporter.spark.screenshotOnFail=true

